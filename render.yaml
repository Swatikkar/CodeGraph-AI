services:
  - type: web
    name: codegraph-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codegraph-ai-postgres
          property: connectionString
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "20"
      - key: PROVIDER_MAX_RETRIES
        value: "0"
      - key: MODEL_TEMPERATURE
        value: "0.1"
      - key: TRUSTED_SEARCH_DOMAINS
        value: react.dev,nextjs.org,vite.dev,developer.mozilla.org,docs.python.org,fastapi.tiangolo.com,python.langchain.com,js.langchain.com,docs.pydantic.dev,docs.sqlalchemy.org,npmjs.com,pypi.org,github.com
      - key: WEB_SEARCH_MAX_RESULTS
        value: "3"
      - key: WEB_SEARCH_TIMEOUT_SECONDS
        value: "8"
      - key: MAX_ZIP_BYTES
        value: "1073741824"
      - key: MAX_PROJECT_FILES
        value: "300"
      - key: MAX_FILE_BYTES
        value: "350000"
      - key: MAX_IMAGE_BYTES
        value: "5000000"
      - key: SUPERVISOR_REASONING_MODELS
        value: groq:llama-3.1-8b-instant,gemini:gemini-2.5-flash,groq:llama-3.3-70b-versatile,gemini:gemini-2.5-pro,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
      - key: DEBUGGER_CODING_MODELS
        value: groq:openai/gpt-oss-120b,gemini:gemini-2.5-flash,groq:qwen/qwen3-32b,openrouter:cohere/north-mini-code:free
      - key: COMMENTER_CODE_DOCS_MODELS
        value: groq:llama-3.1-8b-instant,gemini:gemini-2.5-flash-lite,openrouter:cohere/north-mini-code:free
      - key: ARCHITECTURE_DESIGN_MODELS
        value: gemini:gemini-2.5-flash,groq:llama-3.3-70b-versatile,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
      - key: RETRIEVAL_QUERY_MODELS
        value: gemini:gemini-2.5-flash-lite,groq:llama-3.1-8b-instant
      - key: VISION_ERROR_ANALYSIS_MODELS
        value: gemini:gemini-2.5-flash,nvidia:meta/llama-3.2-90b-vision-instruct,nvidia:meta/llama-3.2-11b-vision-instruct,openrouter:google/gemini-2.5-flash
      - key: EMBEDDING_MODELS
        value: gemini:gemini-embedding-001,huggingface:sentence-transformers/all-MiniLM-L6-v2
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: CodeGraph_AI
      - key: LANGSMITH_ENDPOINT
        value: https://apac.api.smith.langchain.com
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false

  - type: web
    name: codegraph-ai-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_MAX_ZIP_BYTES
        value: "1073741824"

databases:
  - name: codegraph-ai-postgres
    plan: free
    databaseName: codegraph_ai
    user: codegraph_ai
