name: quality-gates

on:
  push:
    branches: [production, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q . -x 'agentenv|chroma_db|uploads|project_trees|artifacts'
      - name: Verify repeatable migrations
        env:
          DATABASE_URL: sqlite:////tmp/codegraph-migrations.db
          ENVIRONMENT: test
        run: python -m alembic upgrade head && python -m alembic upgrade head
      - name: Audit Python dependencies
        run: python -m pip install pip-audit==2.10.1 && python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
